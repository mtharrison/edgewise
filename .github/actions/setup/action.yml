name: Setup
description: Node, Rust and npm dependencies, with npm's bin folder on PATH. With `electron`, also the Electron binary, xvfb and ffmpeg so the app can run and be recorded, and sigrok-cli for the sigrok checks.
inputs:
  rust:
    description: Install the Rust toolchain and restore the cargo cache
    default: 'true'
  electron:
    description: Install the Electron binary, xvfb, ffmpeg (GIFs from scripts/ui.mjs) and sigrok-cli
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    # rustup ships on every hosted runner, so no third-party action is needed.
    - if: inputs.rust == 'true'
      run: rustup toolchain install stable --profile minimal && rustup default stable
      shell: bash
    - if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - run: npm ci
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.electron != 'true' && '1' || '' }}
    # So `openspec` and other npm CLIs run by name, as the skills call them.
    - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      shell: bash
    - if: inputs.electron == 'true' && runner.os == 'Linux'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg sigrok-cli
      shell: bash
