# Runs backlog-pickup Phase 2 when a collaborator adds `spec-approved` to a
# draft PR: implement, verify, archive, mark ready for review, stop.
# The maintainer reviews and merges.

name: Auto build

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: build-${{ github.event.pull_request.number }}

jobs:
  build:
    # Same-repo branches only; fork PRs get no secrets.
    if: >-
      github.event.label.name == 'spec-approved' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # Cheap gate before spending tokens; the skill re-checks everything.
      - name: Labeler is a collaborator
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/collaborators/$SENDER" --silent

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the backlog-pickup skill, Phase 2 only, on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The change is on the checked-out branch ${{ github.event.pull_request.head.ref }}.
            You are running in CI, so:
            - Push after each commit.
            - If a check fails or you get stuck, comment on the PR saying why, leave it in draft, then stop.
            Stop after `gh pr ready`. Never merge.
          claude_args: >-
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(cargo:*),Read,Write,Edit,Glob,Grep,Skill"

      # Pushes and PR changes made with the Claude app token trigger no workflows.
      # Reopening with the owner's token starts CI, Board sync and review.
      # Claude never sees this token.
      - name: Trigger PR workflows
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr close "$PR" -R "$REPO" && gh pr reopen "$PR" -R "$REPO"
