# Runs backlog-pickup Phase 2 when a collaborator adds `spec-approved` to a
# draft PR: implement, verify, archive, mark ready for review, stop.
# The maintainer reviews and merges.

name: Auto build

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: build-${{ github.event.pull_request.number }}

jobs:
  gate:
    # Same-repo branches only; fork PRs get no secrets.
    if: >-
      github.event.label.name == 'spec-approved' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cheap check before spending tokens; the skill re-checks everything.
      - name: Labeler is a collaborator
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/collaborators/$SENDER" --silent

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          electron: 'true'

      - uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the backlog-pickup skill, Phase 2 only, on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The change is on the checked-out branch ${{ github.event.pull_request.head.ref }}.
            You are running in CI, so:
            - Push after each commit.
            - Check UI behaviour in the running app with `node scripts/ui.mjs <check.mjs>` (read the script header). It works here.
            - Put screenshots or GIFs of what changed in the PR body: `scripts/pr-media.sh <PR> <files>` publishes them and prints the Markdown.
            - If tests, typecheck or CI fail and you cannot fix them, comment on the PR saying why, leave it in draft, then stop.
            - A task you cannot check (needs hardware) is not a failure: list it under "Not verified" in the PR body and carry on.
            Stop after `gh pr ready`. Never merge.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(cargo:*),Bash(scripts/linear-status.sh:*),Bash(scripts/pr-media.sh:*),Read,Write,Edit,Glob,Grep,Skill"

