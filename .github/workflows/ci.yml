name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run for the previous push. Runs on main each
# get their own group, so every commit on main is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          electron: 'true'
      - name: OpenSpec
        run: npx openspec validate --all --strict
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: App starts
        run: node scripts/ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-checks
          path: ui-checks/
          if-no-files-found: ignore
