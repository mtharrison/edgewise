# Builds installers for every platform and attaches them to a GitHub release.
# Push a tag matching package.json's version (`git tag v0.1.0 && git push --tags`)
# to release. Run it by hand to get unsigned test installers as workflow artifacts.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: ./.github/actions/setup
        with:
          electron: 'true'
      - name: Package
        if: runner.os != 'macOS'
        run: npm run package
      # Done here rather than via CSC_LINK: electron-builder unlocks its temporary
      # keychain with the certificate password, which macOS 26 rejects.
      - name: Import signing certificate
        if: runner.os == 'macOS' && secrets.CSC_LINK != ''
        env:
          # Developer ID Application certificate (base64 .p12) and its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -base64 24)
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"
      - name: Package, sign and notarize
        if: runner.os == 'macOS'
        run: npm run package
        env:
          # Notarization: Apple ID, an app-specific password, and the team ID.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without the certificate, ad-hoc sign instead of searching for one.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes installers/*
