# Runs backlog-pickup Phase 1 when a collaborator labels an issue `ready`, on
# GitHub or in Linear (Linear applies labels under the member's own GitHub
# account): claim, propose, open a draft PR, stop. Auto build runs Phase 2.

name: Auto pickup

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pickup-${{ github.event.issue.number }}

jobs:
  gate:
    if: github.event.label.name == 'ready' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cheap check before spending tokens; the skill re-checks everything.
      - name: Labeler is a collaborator
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/collaborators/$SENDER" --silent

  pickup:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Looked up here so the agent, which reads untrusted issue text, never holds
      # the key. The ID is empty without LINEAR_API_KEY; a failed lookup doesn't
      # stop the pickup, the PR just isn't linked in Linear until it merges.
      - name: Look up the Linear issue
        id: linear
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          N: ${{ github.event.issue.number }}
        run: |
          id=$(scripts/linear-id.sh "$N")
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the backlog-pickup skill, Phase 1 only, on issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            You are running in CI, so:
            - Assign the issue to ${{ github.event.sender.login }}, not @me.
            - The issue's Linear ID is "${{ steps.linear.outputs.id }}" (empty if unknown). Use it; don't run scripts/linear-id.sh.
            - If any check fails, comment on the issue saying which one, then stop.
            Stop after opening the draft PR. Do not implement.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(npx openspec:*),Read,Write,Edit,Glob,Grep,Skill"

