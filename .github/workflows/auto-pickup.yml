# Runs backlog-pickup Phase 1 when a collaborator labels an issue `ready`:
# claim, propose, open a draft PR, stop. Phase 2 stays manual.
# PROJECT_TOKEN is only used in its own job: steps in one job share a runner,
# so a hijacked Claude step could otherwise plant a fake `gh` and capture it.

name: Auto pickup

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pickup-${{ github.event.issue.number }}

jobs:
  gate:
    if: github.event.label.name == 'ready' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cheap check before spending tokens; the skill re-checks everything.
      - name: Labeler is a collaborator
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/collaborators/$SENDER" --silent

  pickup:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the backlog-pickup skill, Phase 1 only, on issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            You are running in CI, so:
            - Assign the issue to ${{ github.event.sender.login }}, not @me.
            - Skip the board checks and the board Status edit; your token cannot reach the user project, and Board sync handles Status.
            - If any check fails, comment on the issue saying which one, then stop.
            Stop after opening the draft PR. Do not implement.
          claude_args: >-
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(npx openspec:*),Read,Write,Edit,Glob,Grep,Skill"

  trigger:
    needs: [gate, pickup]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PRs opened with the Claude app token trigger no workflows. Reopening with
      # the owner's token starts CI and Board sync.
      - name: Trigger PR workflows
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pr in $(gh pr list -R "$REPO" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$N-\")) | .number"); do
            gh pr close "$pr" -R "$REPO" && gh pr reopen "$pr" -R "$REPO"
          done
