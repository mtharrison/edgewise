# Runs backlog-pickup Phase 1 when an issue gets the `ready` label, applied by
# a collaborator on GitHub or by a workspace member in Linear (the label arrives
# through Linear's GitHub Issues Sync as linear[bot]):
# claim, propose, open a draft PR, stop. Auto build runs Phase 2.

name: Auto pickup

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pickup-${{ github.event.issue.number }}

jobs:
  gate:
    if: github.event.label.name == 'ready' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cheap check before spending tokens; the skill re-checks everything.
      - name: Labeler is a collaborator or Linear
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: '[ "$SENDER" = "linear[bot]" ] || gh api "repos/$REPO/collaborators/$SENDER" --silent'

  pickup:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the backlog-pickup skill, Phase 1 only, on issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            You are running in CI, so:
            - Assign the issue to ${{ github.repository_owner }}, not @me.
            - If any check fails, comment on the issue saying which one, then stop.
            Stop after opening the draft PR. Do not implement.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(npx openspec:*),Bash(scripts/linear-status.sh:*),Read,Write,Edit,Glob,Grep,Skill"

