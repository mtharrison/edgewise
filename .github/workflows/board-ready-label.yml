# Dragging a card to Ready fires no event (user projects don't reach Actions),
# so poll the board and apply `ready` to open Ready issues that lack it.
# PROJECT_TOKEN is the owner's token, so the label counts as a collaborator's
# and triggers Auto pickup. Only the owner can move cards on the board.

name: Board ready label

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: board-ready-label

jobs:
  label:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      REPO: ${{ github.repository }}
      PROJECT_ID: PVT_kwHOAA36YM4BkieC
    steps:
      # Queries by project ID: `gh project item-list --owner` fails with this token.
      - name: Label Ready cards
        run: |
          set -euo pipefail
          gh api graphql --paginate -f id="$PROJECT_ID" -f query='
            query($id: ID!, $endCursor: String) {
              node(id: $id) { ... on ProjectV2 { items(first: 100, after: $endCursor) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  status: fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                  content { ... on Issue { number state repository { nameWithOwner } labels(first: 50) { nodes { name } } } }
                }
              } } }
            }' \
            --jq ".data.node.items.nodes[] | select(.status.name == \"Ready\" and .content.state == \"OPEN\" and .content.repository.nameWithOwner == \"$REPO\" and ([.content.labels.nodes[].name] | index(\"ready\") | not)) | .content.number" |
          while read -r n; do
            gh issue edit "$n" -R "$REPO" --add-label ready
            echo "#$n labelled ready"
          done
