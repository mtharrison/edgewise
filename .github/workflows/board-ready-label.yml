# Dragging a card to Ready fires no event (user projects don't reach Actions),
# so poll the board and apply `ready` to open Ready issues that lack it.
# PROJECT_TOKEN is the owner's token, so the label counts as a collaborator's
# and triggers Auto pickup. Only the owner can move cards on the board.

name: Board ready label

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: board-ready-label

jobs:
  label:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Label Ready cards
        run: |
          set -euo pipefail
          gh project item-list 3 --owner mtharrison --format json --limit 500 \
            --jq ".items[] | select(.status == \"Ready\" and .content.type == \"Issue\" and .content.repository == \"$REPO\") | .content.number" |
          while read -r n; do
            if gh issue view "$n" -R "$REPO" --json state,labels \
              -q '.state == "OPEN" and ([.labels[].name] | index("ready") | not)' | grep -qx true; then
              gh issue edit "$n" -R "$REPO" --add-label ready
              echo "#$n labelled ready"
            fi
          done
