[package]
name = "logic-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
logic-core = { path = "../logic-core" }
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
serde_json = "1"
serde = "1"

[build-dependencies]
napi-build = "2"
